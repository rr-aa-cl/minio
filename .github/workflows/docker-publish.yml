name: Publish Docker image

on:
  push:
    branches:
      - master
    tags:
      - "RELEASE.*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    name: Build and push to GHCR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: 1.24.x
          check-latest: true

      - name: Compute release and image name
        id: vars
        run: |
          release="$(git describe --tags --abbrev=0 2>/dev/null || echo "dev")-$(git rev-parse --short HEAD)"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            release="${GITHUB_REF_NAME}"
          fi
          echo "release=${release}" >> "$GITHUB_OUTPUT"
          echo "image=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      # The Dockerfile copies prebuilt per-arch binaries, so build them here.
      # The .minisig files are empty placeholders; releases are not signed in CI.
      - name: Build binaries
        env:
          CGO_ENABLED: "0"
          MINIO_RELEASE: RELEASE
          RELEASE: ${{ steps.vars.outputs.release }}
        run: |
          LDFLAGS=$(go run buildscripts/gen-ldflags.go)
          for arch in amd64 arm64; do
            GOOS=linux GOARCH=${arch} go build -tags kqueue -trimpath --ldflags "${LDFLAGS}" -o "./minio-${arch}.${RELEASE}"
            sha256sum "./minio-${arch}.${RELEASE}" | sed "s# .*# minio.${RELEASE}#" > "./minio-${arch}.${RELEASE}.sha256sum"
            : > "./minio-${arch}.${RELEASE}.minisig"
          done

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.vars.outputs.image }}
          tags: |
            type=raw,value=${{ steps.vars.outputs.release }}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}
            type=ref,event=branch
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            RELEASE=${{ steps.vars.outputs.release }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
